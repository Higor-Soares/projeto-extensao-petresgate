<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Resgatando Anjos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container-site">
        <div class="backdrop-menu" id="backdropMenu"></div>
        <header class="cabecalho">
            <div class="area-logo">
                <img src="image/logo-resgatando-anjos.png" alt="Logo Resgatando Anjos" class="logo-img">
            </div>
            <button class="botao-menu-mobile" id="botaoMenuMobile" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="menu" id="menuPrincipal">
                <a href="index.html">Início</a>
                <a href="cadastrar.html" class="ativo">Cadastrar Perdido</a>
                <a href="cadastrar-animal.html">Doar Animal</a>
                <a href="busca.html">Buscar</a>
                <a href="doacao-dinheiro.html">Ajudar com PIX</a>
            </nav>
        </header>
        <main>
            <section class="secao-formulario">
                <h1>Cadastrar pet</h1>
                <form class="form-cadastro">
                    <label for="nome">Nome do pet</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome do pet" required>

                    <div class="grupo-duplo">
                        <div>
                            <label for="especie">Espécie</label>
                            <input type="text" id="especie" name="especie" placeholder="Cachorro, gato..." required>
                        </div>
                        <div>
                            <label for="raca">Raça</label>
                            <input type="text" id="raca" name="raca" placeholder="Raça ou SRD" required>
                        </div>
                    </div>

                    <label for="porte">Porte</label>
                    <input type="text" id="porte" name="porte" placeholder="Pequeno, médio, grande" required>

                    <label for="cor">Cor predominante</label>
                    <input type="text" id="cor" name="cor" placeholder="Descreva a cor" required>

                    <label for="cidade">Cidade/Bairro</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Cidade e bairro" required>

                    <label for="data">Data (desaparecimento ou resgate)</label>
                    <input type="date" id="data" name="data" required>

                    <label for="local">Detalhes / Onde foi visto pela última vez</label>
                    <input type="text" id="local" name="local" placeholder="Descreva local ou situação" required>

                    <label for="contato">Contato para retorno</label>
                    <input type="text" id="contato" name="contato" placeholder="Telefone ou e-mail">

                    <label for="foto">Foto do pet</label>
                    <input type="file" id="foto" name="foto" accept="image/*">

                    <button type="submit">Cadastrar</button>
                </form>
            </section>
        </main>
        <footer class="rodape">
            <div class="rodape-esquerda">Contato</div>
            <div class="rodape-centro">Direitos autorais</div>
            <div class="rodape-direita">
                <span class="icone"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a7.5 7.5 0 0 1 13 0"/></svg></span>
                <span class="icone"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 15h8M8 12h8M8 9h8"/></svg></span>
                <span class="icone"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 8a6 6 0 0 1-8 0"/></svg></span>
            </div>
        </footer>
    </div>
    <script>
        // Menu hamburger responsivo com backdrop
        const botaoMenu = document.getElementById('botaoMenuMobile');
        const menu = document.getElementById('menuPrincipal');
        const backdropMenu = document.getElementById('backdropMenu');
        const linksMenu = menu.querySelectorAll('a');

        function fecharMenu() {
            botaoMenu.classList.remove('ativo');
            menu.classList.remove('ativo');
            backdropMenu.classList.remove('ativo');
            botaoMenu.setAttribute('aria-expanded', 'false');
        }

        function abrirMenu() {
            botaoMenu.classList.add('ativo');
            menu.classList.add('ativo');
            if (window.innerWidth <= 900) {
                backdropMenu.classList.add('ativo');
            }
            botaoMenu.setAttribute('aria-expanded', 'true');
        }

        // Abrir/fechar menu ao clicar no botão
        botaoMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            if (botaoMenu.classList.contains('ativo')) {
                fecharMenu();
            } else {
                abrirMenu();
            }
        });

        // Fechar menu quando clicar no backdrop
        backdropMenu.addEventListener('click', fecharMenu);

        // Fechar menu quando clicar em um link
        linksMenu.forEach(link => {
            link.addEventListener('click', fecharMenu);
        });

        // Prevenir que clicks dentro do menu fechem ele
        menu.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Fechar menu quando redimensionar a tela para desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) {
                fecharMenu();
            }
        });

        // Prevenir scroll quando o menu está aberto
        const observer = new MutationObserver(() => {
            if (menu.classList.contains('ativo')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        });

        observer.observe(menu, { attributes: true });
    </script>
    <script type="module" src="./js/cadastrar.js"></script>
</body>
</html>
