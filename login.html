<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Resgatando Anjos</title>
    <link rel="icon" type="image/png" href="image/logo-resgatando-anjos.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        window.location.href = 'admin.html';
    </script>
</head>

<body>
    <div class="container-site">
        <div class="backdrop-menu" id="backdropMenu"></div>
        <header class="cabecalho">
            <div class="area-logo">
                <img src="image/logo-resgatando-anjos.png" alt="Logo Resgatando Anjos" class="logo-img">
            </div>
            <button class="botao-menu-mobile" id="botaoMenuMobile" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>
        <main>
            <section class="secao-formulario login-card" id="secaoLoginAdmin">
                <div class="login-header">
                    <div class="login-badge">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                    </div>
                    <h1>Área Administrativa</h1>
                    <p class="subtitulo">Acesso restrito para administradores do sistema</p>
                </div>

                <div id="mensagemErro" class="mensagem-erro-login" style="display: none;"></div>

                <form class="form-login" id="formLogin">
                    <div class="campo-grupo">
                        <label for="email">E-mail</label>
                        <div class="input-com-icone">
                            <svg class="icone-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                            <input type="email" id="email" name="email" placeholder="admin@petresgate.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <div class="label-linha">
                            <label for="senha">Senha</label>
                            <a href="nova-senha.html" class="link-esqueceu-senha">Esqueceu a senha?</a>
                        </div>
                        <div class="input-com-icone">
                            <svg class="icone-input" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                            <button type="button" class="btn-toggle-senha" id="btnToggleSenha" aria-label="Mostrar ou ocultar senha" title="Mostrar/Ocultar senha">
                                <svg class="icone-olho" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="botaoEntrar" class="btn-login-submit">
                        <span>Entrar no Painel</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>

                <div class="login-rodape-links">
                    <a href="index.html" class="link-voltar-home">← Voltar ao site público</a>
                </div>
            </section>
        </main>
        <footer class="rodape">
            <div class="rodape-esquerda">
                <a href="https://www.instagram.com/resgatandoanjostatui/" target="_blank" rel="noopener noreferrer" class="link-instagram">
                    <span class="icone-instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </span>
                    <span>@resgatandoanjostatui</span>
                </a>
            </div>
            <div class="rodape-centro">© Resgatando Anjos Tatuí</div>
            <div class="rodape-direita">
                <a href="https://www.instagram.com/resgatandoanjostatui/" target="_blank" rel="noopener noreferrer" class="link-instagram" title="Siga-nos no Instagram">
                    <span class="icone-instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </span>
                    <span>Instagram</span>
                </a>
            </div>
        </footer>
    </div>
</body>
<script>
    // Menu hamburger responsivo com backdrop
    const botaoMenu = document.getElementById('botaoMenuMobile');
    const menu = document.getElementById('menuPrincipal');
    const backdropMenu = document.getElementById('backdropMenu');
    const linksMenu = menu.querySelectorAll('a');

    function fecharMenu() {
        botaoMenu.classList.remove('ativo');
        menu.classList.remove('ativo');
        backdropMenu.classList.remove('ativo');
        botaoMenu.setAttribute('aria-expanded', 'false');
    }

    function abrirMenu() {
        botaoMenu.classList.add('ativo');
        menu.classList.add('ativo');
        if (window.innerWidth <= 900) {
            backdropMenu.classList.add('ativo');
        }
        botaoMenu.setAttribute('aria-expanded', 'true');
    }

    // Abrir/fechar menu ao clicar no botão
    botaoMenu.addEventListener('click', (e) => {
        e.stopPropagation();
        if (botaoMenu.classList.contains('ativo')) {
            fecharMenu();
        } else {
            abrirMenu();
        }
    });

    // Fechar menu quando clicar no backdrop
    backdropMenu.addEventListener('click', fecharMenu);

    // Fechar menu quando clicar em um link
    linksMenu.forEach(link => {
        link.addEventListener('click', fecharMenu);
    });

    // Prevenir que clicks dentro do menu fechem ele
    menu.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    // Fechar menu quando redimensionar a tela para desktop
    window.addEventListener('resize', () => {
        if (window.innerWidth > 900) {
            fecharMenu();
        }
    });

    // Prevenir scroll quando o menu está aberto
    const observer = new MutationObserver(() => {
        if (menu.classList.contains('ativo')) {
            document.body.style.overflow = 'hidden';
        } else {
            document.body.style.overflow = '';
        }
    });

    observer.observe(menu, { attributes: true });
</script>
<script type="module" src="js/login.js"></script>

</html>
