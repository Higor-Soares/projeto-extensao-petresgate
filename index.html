<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resgatando Anjos</title>
    <link rel="icon" type="image/png" href="image/logo-resgatando-anjos.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .backdrop-menu {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 998;
            display: none;
            transition: background 0.3s ease;
        }

        .backdrop-menu.ativo {
            background: rgba(0, 0, 0, 0.3);
            display: block;
        }

        .modal-detalhes {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 3000;
        }

        .modal-detalhes.hidden {
            display: none;
        }

        .modal-detalhes-conteudo {
            width: 100%;
            max-width: 700px;
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18);
        }

        .modal-detalhes-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }

        .modal-detalhes-cabecalho h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .modal-detalhes-cabecalho button {
            border: none;
            background: transparent;
            font-size: 1.2rem;
            cursor: pointer;
            color: #333;
        }

        .modal-detalhes-body {
            padding: 24px;
            display: grid;
            gap: 18px;
        }

        .modal-detalhes-body img {
            width: 100%;
            border-radius: 14px;
            object-fit: cover;
            max-height: 360px;
        }

        .modal-detalhes-body p {
            margin: 0;
            line-height: 1.6;
            color: #444;
        }

        .modal-detalhes-body .linha {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal-detalhes-body .linha span {
            width: calc(50% - 10px);
            min-width: 160px;
            color: #555;
        }

        @media (max-width: 640px) {
            .modal-detalhes-body .linha span {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container-site">
        <div class="backdrop-menu" id="backdropMenu"></div>
        <header class="cabecalho">
            <div class="area-logo">
                <img src="image/logo-resgatando-anjos.png" alt="Logo Resgatando Anjos" class="logo-img">
            </div>
            <button class="botao-menu-mobile" id="botaoMenuMobile" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="menu" id="menuPrincipal">
                <a href="index.html">Animais para Adoção</a>
                <a href="como-ajudar.html">Como Ajudar</a>
            </nav>
        </header>
        <main>
            <section class="secao-destaque">
                <h1>Adote ou Ajude<br>animais resgatados</h1>
                <form class="caixa-busca" autocomplete="off">
                    <input type="text" placeholder="Nome do pet ou cidade" aria-label="Nome do pet ou cidade">
                    <button type="submit">Buscar pets</button>
                </form>
            </section>
            <section class="secao-destaques">
                <h2>Destaques de pets</h2>
                <div class="grade-cards"></div>
            </section>
        </main>
        <footer class="rodape">
            <div class="rodape-esquerda">
                <a href="https://www.instagram.com/resgatandoanjostatui/" target="_blank" rel="noopener noreferrer"
                    class="link-instagram">
                    <span class="icone-instagram">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                        </svg>
                    </span>
                    <span>@resgatandoanjostatui</span>
                </a>
            </div>
            <div class="rodape-centro">© Resgatando Anjos Tatuí</div>
        </footer>
    </div>
    <div id="modalDetalhes" class="modal-detalhes hidden" aria-hidden="true">
        <div class="modal-detalhes-conteudo" role="dialog" aria-modal="true" aria-labelledby="tituloModalDetalhes">
            <div class="modal-detalhes-cabecalho">
                <h3 id="tituloModalDetalhes">Detalhes do pet</h3>
                <button type="button" id="fecharModal" aria-label="Fechar modal">×</button>
            </div>
            <div class="modal-detalhes-body" id="modalConteudo"></div>
        </div>
    </div>
    <script>
        // Menu hamburger responsivo com backdrop
        const botaoMenu = document.getElementById('botaoMenuMobile');
        const menu = document.getElementById('menuPrincipal');
        const backdropMenu = document.getElementById('backdropMenu');
        const linksMenu = menu.querySelectorAll('a');

        function fecharMenu() {
            botaoMenu.classList.remove('ativo');
            menu.classList.remove('ativo');
            backdropMenu.classList.remove('ativo');
            botaoMenu.setAttribute('aria-expanded', 'false');
        }

        function abrirMenu() {
            botaoMenu.classList.add('ativo');
            menu.classList.add('ativo');
            if (window.innerWidth <= 900) {
                backdropMenu.classList.add('ativo');
            }
            botaoMenu.setAttribute('aria-expanded', 'true');
        }

        // Abrir/fechar menu ao clicar no botão
        botaoMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            if (botaoMenu.classList.contains('ativo')) {
                fecharMenu();
            } else {
                abrirMenu();
            }
        });

        // Fechar menu quando clicar no backdrop
        backdropMenu.addEventListener('click', fecharMenu);

        // Fechar menu quando clicar em um link
        linksMenu.forEach(link => {
            link.addEventListener('click', fecharMenu);
        });

        // Prevenir que clicks dentro do menu fechem ele
        menu.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Fechar menu quando redimensionar a tela para desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) {
                fecharMenu();
            }
        });

        // Prevenir scroll quando o menu está aberto
        const observer = new MutationObserver(() => {
            if (menu.classList.contains('ativo')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        });

        observer.observe(menu, { attributes: true });
    </script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
