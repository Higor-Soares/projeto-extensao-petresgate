<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - Resgatando Anjos</title>
    <link rel="icon" type="image/png" href="image/logo-resgatando-anjos.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .resultados-busca {
            display: grid;
            gap: 20px;
            margin-top: 24px;
        }

        .cartao-pet {
            display: flex;
            gap: 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 16px;
            background: #fff;
            align-items: stretch;
        }

        .cartao-pet-imagem {
            width: 180px;
            min-width: 180px;
            height: 180px;
            border-radius: 14px;
            overflow: hidden;
            background: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cartao-pet-imagem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sem-imagem {
            color: #777;
            padding: 12px;
            text-align: center;
        }

        .cartao-pet-conteudo h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .cartao-pet-conteudo p {
            margin: 6px 0;
            line-height: 1.5;
        }

        .nenhum-resultado,
        .erro-resultado {
            color: #555;
            font-size: 1rem;
            padding: 16px;
            background: #f7f7f7;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="container-site">
        <div class="backdrop-menu" id="backdropMenu"></div>
        <header class="cabecalho">
            <div class="area-logo">
                <img src="image/logo-resgatando-anjos.png" alt="Logo Resgatando Anjos" class="logo-img">
            </div>
            <button class="botao-menu-mobile" id="botaoMenuMobile" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="menu" id="menuPrincipal">
                <a href="index.html">Início</a>
                <a href="cadastrar-animal.html">Doar Animal para Adoção</a>
                <a href="doacao-dinheiro.html">Como Ajudar</a>
            </nav>
        </header>
        <main>
            <section class="secao-formulario" style="text-align: center;">
                <h1>Buscar Pets Perdidos</h1>
                <p class="subtitulo" style="margin: 20px 0; font-size: 1.1rem; color: #555;">
                    Esta funcionalidade está temporariamente inativa. No momento, nosso foco está totalmente direcionado para a doação e adoção de animais resgatados.
                </p>
                <a href="index.html" style="display: inline-block; background: #1A4F9C; color: #fff; padding: 14px 28px; text-decoration: none; border-radius: 12px; font-weight: 600; margin-top: 10px;">Ver Animais para Adoção</a>
            </section>
        </main>
        <footer class="rodape">
            <div class="rodape-esquerda">Contato</div>
            <div class="rodape-centro">Direitos autorais</div>
            <div class="rodape-direita">
                <span class="icone"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="7" r="4" />
                        <path d="M5.5 21a7.5 7.5 0 0 1 13 0" />
                    </svg></span>
                <span class="icone"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M8 15h8M8 12h8M8 9h8" />
                    </svg></span>
                <span class="icone"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M16 8a6 6 0 0 1-8 0" />
                    </svg></span>
            </div>
        </footer>
    </div>
    <script>
        // Menu hamburger responsivo com backdrop
        const botaoMenu = document.getElementById('botaoMenuMobile');
        const menu = document.getElementById('menuPrincipal');
        const backdropMenu = document.getElementById('backdropMenu');
        const linksMenu = menu.querySelectorAll('a');

        function fecharMenu() {
            botaoMenu.classList.remove('ativo');
            menu.classList.remove('ativo');
            backdropMenu.classList.remove('ativo');
            botaoMenu.setAttribute('aria-expanded', 'false');
        }

        function abrirMenu() {
            botaoMenu.classList.add('ativo');
            menu.classList.add('ativo');
            if (window.innerWidth <= 900) {
                backdropMenu.classList.add('ativo');
            }
            botaoMenu.setAttribute('aria-expanded', 'true');
        }

        // Abrir/fechar menu ao clicar no botão
        botaoMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            if (botaoMenu.classList.contains('ativo')) {
                fecharMenu();
            } else {
                abrirMenu();
            }
        });

        // Fechar menu quando clicar no backdrop
        backdropMenu.addEventListener('click', fecharMenu);

        // Fechar menu quando clicar em um link
        linksMenu.forEach(link => {
            link.addEventListener('click', fecharMenu);
        });

        // Prevenir que clicks dentro do menu fechem ele
        menu.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Fechar menu quando redimensionar a tela para desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) {
                fecharMenu();
            }
        });

        // Prevenir scroll quando o menu está aberto
        const observer = new MutationObserver(() => {
            if (menu.classList.contains('ativo')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        });

        observer.observe(menu, { attributes: true });
    </script>
    <script type="module" src="./js/busca.js"></script>
</body>

</html>
