<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Animal para Doação - Resgatando Anjos</title>
    <link rel="icon" type="image/png" href="image/logo-resgatando-anjos.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container-site">
        <div class="backdrop-menu" id="backdropMenu"></div>
        <header class="cabecalho">
            <div class="area-logo">
                <img src="image/logo-resgatando-anjos.png" alt="Logo Resgatando Anjos" class="logo-img">
            </div>
            <button class="botao-menu-mobile" id="botaoMenuMobile" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="menu" id="menuPrincipal">
                <a href="index.html">Início</a>
                <a href="cadastrar-animal.html" class="ativo">Doar Animal para Adoção</a>
                <a href="como-ajudar.html">Como Ajudar</a>
            </nav>
        </header>
        <main>
            <section class="secao-formulario">
                <h1>Cadastre o Animal para Doação</h1>
                <p class="subtitulo">Ajude um animal a encontrar um novo lar. Preencha os dados abaixo.</p>
                <form class="form-cadastro" id="formAnimal">
                    <h3>Informações do Animal</h3>

                    <label for="nomeAnimal">Nome do animal *</label>
                    <input type="text" id="nomeAnimal" name="nomeAnimal" placeholder="Digite o nome do animal" required>

                    <div class="grupo-duplo">
                        <div>
                            <label for="especie">Espécie *</label>
                            <select id="especie" name="especie" required>
                                <option value="">Selecione a espécie</option>
                                <option value="cachorro">Cachorro</option>
                                <option value="gato">Gato</option>
                                <option value="coelho">Coelho</option>
                                <option value="pássaro">Pássaro</option>
                                <option value="roedor">Roedor</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>
                        <div>
                            <label for="raca">Raça/Tipo *</label>
                            <input type="text" id="raca" name="raca" placeholder="Ex: Poodle, Siamês..." required>
                        </div>
                    </div>

                    <div class="grupo-duplo">
                        <div>
                            <label for="idade">Idade (anos) *</label>
                            <input type="number" id="idade" name="idade" min="0" step="0.5" placeholder="Ex: 2, 0.5"
                                required>
                        </div>
                        <div>
                            <label for="sexo">Sexo *</label>
                            <select id="sexo" name="sexo" required>
                                <option value="">Selecione</option>
                                <option value="macho">Macho</option>
                                <option value="femea">Fêmea</option>
                            </select>
                        </div>
                    </div>

                    <label for="descricao">Descrição do animal *</label>
                    <textarea id="descricao" name="descricao"
                        placeholder="Descreva o temperamento, características especiais, necessidades de cuidados..."
                        required></textarea>

                    <label for="foto">Foto do animal *</label>
                    <input type="file" id="foto" name="foto" accept="image/*" required>

                    <h3>Informações de Saúde</h3>

                    <div class="grupo-duplo">
                        <div>
                            <label for="vacinado">Vacinado? *</label>
                            <select id="vacinado" name="vacinado" required>
                                <option value="">Selecione</option>
                                <option value="sim">Sim</option>
                                <option value="nao">Não</option>
                                <option value="parcial">Parcialmente</option>
                            </select>
                        </div>
                        <div>
                            <label for="castrado">Castrado/Esterilizado? *</label>
                            <select id="castrado" name="castrado" required>
                                <option value="">Selecione</option>
                                <option value="sim">Sim</option>
                                <option value="nao">Não</option>
                            </select>
                        </div>
                    </div>

                    <label for="problemasHealth">Problemas de saúde ou alergias conhecidas?</label>
                    <textarea id="problemasHealth" name="problemasHealth"
                        placeholder="Descreva qualquer problema de saúde ou alergia..."></textarea>

                    <h3>Informações do Doador</h3>

                    <label for="nomeDoador">Seu nome *</label>
                    <input type="text" id="nomeDoador" name="nomeDoador" placeholder="Digite seu nome completo"
                        required>

                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(XX) 99999-9999" required>

                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>

                    <label for="cidade">Cidade *</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>

                    <label for="motivo">Por que está doando o animal? *</label>
                    <textarea id="motivo" name="motivo" placeholder="Explique brevemente o motivo da doação..."
                        required></textarea>

                    <div class="checkbox-container">
                        <input type="checkbox" id="termos" name="termos" required>
                        <label for="termos">Declaro que todas as informações são verdadeiras e autorizo o Resgatando
                            Anjos a compartilhar estes dados com potenciais adotantes. *</label>
                    </div>

                    <button type="submit" class="botao-enviar">Cadastrar Animal</button>
                </form>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js?v=4"></script>
    <script type="module" src="js/cadastrar-animal.js?v=4"></script>
</body>

</html>
